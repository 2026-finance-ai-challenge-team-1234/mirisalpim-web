name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-for-runtime
      DATABASE_URL: postgresql://mirisalpim_ci:ci-password@127.0.0.1:5432/mirisalpim_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirisalpim_ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mirisalpim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mirisalpim_ci -d mirisalpim_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: python -m ai_core.validate
      - run: python -m ai_core.smoke
      - run: python manage.py check
        working-directory: backend
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py seed_scenarios --check
        working-directory: backend
      - run: python manage.py test
        working-directory: backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mirisalpim_ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: mirisalpim_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mirisalpim_ci -d mirisalpim_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mirisalpim-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify scenario seed in final image
        run: >-
          docker run --rm
          --network host
          -e SECRET_KEY=ci-runtime-only
          -e DATABASE_URL=postgresql://mirisalpim_ci:ci-password@127.0.0.1:5432/mirisalpim_ci
          mirisalpim-web:ci
          /bin/sh -c "python manage.py migrate --noinput && python manage.py seed_scenarios"
