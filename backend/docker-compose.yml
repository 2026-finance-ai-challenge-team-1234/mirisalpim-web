services:
    db:
        image: pgvector/pgvector:pg16
        restart: unless-stopped
        environment:
            POSTGRES_USER: mirisalpim
            POSTGRES_PASSWORD: localdev
            POSTGRES_DB: mirisalpim
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U mirisalpim"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    pgdata:
